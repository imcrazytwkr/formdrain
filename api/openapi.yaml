openapi: 3.0.3
info:
  title: Formdrain API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /users/current:
    get:
      operationId: getCurrentUser
      summary: Get the currently authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sites/{id}:
    get:
      operationId: getSiteConfig
      summary: Get a site config by ID
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Site config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Site not found or access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sites:
    get:
      operationId: listSites
      summary: List sites owned by the current user
      security:
        - cookieAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id, hostname]
            default: id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          description: Invalid sort or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forms:
    get:
      operationId: listForms
      summary: List forms owned by the current user
      security:
        - cookieAuth: []
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id, site_id, hostname]
            default: id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormList"
        "400":
          description: Invalid sort or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: formdrain_session
  schemas:
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
    Site:
      type: object
      required:
        - id
        - hostname
        - owner_id
      properties:
        id:
          type: integer
          format: int64
        hostname:
          type: string
        owner_id:
          type: integer
          format: int64
    SiteList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        next_cursor:
          type: string
    FormListItem:
      type: object
      required:
        - id
        - site_id
      properties:
        id:
          type: integer
          format: int64
        site_id:
          type: integer
          format: int64
    FormList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FormListItem"
        next_cursor:
          type: string
    Error:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
        message:
          type: string
